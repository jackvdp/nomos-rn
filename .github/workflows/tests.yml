name: Tests

on:
  pull_request:
  push:
    branches: [main]

# A new push to a branch cancels the run for the push before it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # The ruleset on main requires this job by name, so renaming it means updating the ruleset.
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Jest in every workspace that has a test script: tokens (unit) and ui (component and story tests).
      - run: npm test
